plugins { id 'com.android.application' }
android {
    namespace 'app.photos.unlimited'
    compileSdk 37
    defaultConfig {
        applicationId 'app.photos.unlimited'
        minSdk 33
        targetSdk 37
        versionCode 10
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        preview {
            if (System.getenv('PHOTOS_KEYSTORE')) {
                storeFile file(System.getenv('PHOTOS_KEYSTORE'))
                storePassword System.getenv('PHOTOS_SIGN_PASSWORD')
                keyAlias 'photos-unlimited'
                keyPassword System.getenv('PHOTOS_SIGN_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.preview
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
