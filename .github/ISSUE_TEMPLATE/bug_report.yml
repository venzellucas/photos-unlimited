name: Bug report
description: Something in Photos Unlimited doesn't work as expected.
labels: [bug]
body:
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Settings → About and open-source credits shows it.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone model
      placeholder: "Android 16, Pixel 9"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you did, and what the app showed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: diagnostic
    attributes:
      label: Profile or scan label, or Account diagnostic result
      description: For example SCAN_FORMAT_PAGE_SHAPE_NONE_F4_D, or the label in brackets in a message.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed tokens, cookies, email addresses and private photos
          required: true
